<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101426">
<meta name="description" content="MARCO AI - Your AI. Your World.">
<title>MARCO AI — Your AI. Your World.</title>
<style>
*{box-sizing:border-box} :root{--bg:#0c1020;--panel:#151b30;--panel2:#1b2340;--text:#f4f6ff;--muted:#9ba5c2;--purple:#9b8cff;--line:#29314c}
body{margin:0;background:radial-gradient(ellipse at 80% 0%,#24204b 0%,transparent 38%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.topbar{height:66px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;position:sticky;top:0;background:#0c1020eF;backdrop-filter:blur(12px);z-index:2}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:14px;letter-spacing:1.4px;font-weight:800}.brand b{color:var(--purple)}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#9b8cff,#5d54c8);display:grid;place-items:center;font-size:19px;color:white}
.status{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:30px}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#60d6a3;margin-right:5px}
main{max-width:760px;margin:auto;padding:26px 17px 45px}.hero{padding:22px 5px 25px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--purple);font-weight:800}.hero h1{font-size:clamp(34px,8vw,53px);line-height:1.08;letter-spacing:-1.8px;margin:14px 0}.hero h1 span{background:linear-gradient(90deg,#b7aaff,#79d7d4);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:14px;line-height:1.6}.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.hero-tags span,.free-pill{font-size:10px;color:#c9c2ff;background:#9b8cff18;border:1px solid #9b8cff40;padding:7px 10px;border-radius:30px}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 20px}.tool-card{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:15px 13px;color:var(--text);min-height:116px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}.tool-card.active{border-color:#9b8cff;background:linear-gradient(145deg,#28244a,#171c32);box-shadow:0 0 0 1px #9b8cff22}.tool-icon{width:29px;height:29px;border-radius:9px;background:#9b8cff20;color:#c6bdff;display:grid;place-items:center;font-size:17px}.tool-card strong{font-size:13px}.tool-card small{font-size:10px;color:var(--muted)}
.workspace,.roadmap{border:1px solid var(--line);background:linear-gradient(145deg,#171d33,#111729);border-radius:19px;padding:19px;margin-top:15px}.workspace-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.workspace h2,.roadmap h2{font-size:21px;margin:5px 0 0;letter-spacing:-.5px}.workspace label{display:block;color:#c8cee2;font-size:12px;margin:13px 0 8px}textarea,select{width:100%;background:#0d1325;border:1px solid #303956;border-radius:11px;padding:12px;color:var(--text);font:inherit;font-size:13px;outline:none}textarea:focus,select:focus{border-color:var(--purple)}textarea{resize:vertical;min-height:82px}.two-fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.primary{width:100%;margin-top:17px;border:0;border-radius:11px;padding:14px;background:linear-gradient(90deg,#8e7cff,#6c83ed);color:white;font-size:14px;font-weight:800}.primary span{margin-left:5px}.output-wrap{margin-top:18px;border:1px solid #394263;background:#0c1325;border-radius:12px;padding:13px}.output-head{display:flex;align-items:center;justify-content:space-between;font-size:12px}.copy{border:1px solid #454e70;background:#202945;color:#e5e7ff;border-radius:8px;padding:7px 10px;font-size:11px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 inherit;color:#e3e7f7;margin:13px 0 3px}.notice{font-size:10px;color:#8f9ab8;line-height:1.5;margin:14px 0 0}.hidden{display:none}.roadmap{margin-top:18px}.roadmap h2{font-size:19px;margin:8px 0 17px}.step{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #ffffff10}.step>span{width:31px;height:31px;border-radius:9px;background:#9b8cff20;color:#c9c1ff;display:grid;place-items:center;font-size:11px;font-weight:800}.step div{display:flex;flex-direction:column;gap:4px;flex:1}.step b{font-size:12px}.step small{font-size:10px;color:var(--muted)}.step em{font-style:normal;color:#b9b0ff;font-size:10px}footer{padding:22px;text-align:center;color:#d5d8e8;font-size:11px;letter-spacing:2px;border-top:1px solid #ffffff12}footer span{display:block;color:#7f89a6;font-size:10px;letter-spacing:0;margin-top:6px}
@media(min-width:650px){main{padding-top:42px}.tool-grid{grid-template-columns:repeat(4,1fr)}.tool-card{min-height:130px}.hero{padding-bottom:35px}}
/* ===== v2 additions ===== */
.top-right{display:flex;gap:8px;align-items:center}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:30px;overflow:hidden}
.lang-toggle button{background:none;border:0;color:var(--muted);padding:7px 11px;font-size:11px;font-weight:700}
.lang-toggle button.on{background:linear-gradient(90deg,#8e7cff,#6c83ed);color:#fff}
.demo-banner{margin:6px 0 14px;padding:11px 13px;border-radius:12px;font-size:12px;line-height:1.5;background:#f59e0b1f;border:1px solid #f59e0b66;color:#fcd34d}
.demo-banner.live{background:#10b9811f;border-color:#10b98166;color:#6ee7b7}
.tool-grid{grid-template-columns:1fr 1fr}
.tool-card:last-child:nth-child(odd){grid-column:1/-1;min-height:84px}
#chat-box .chat-log{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:13px;font-size:13px;line-height:1.55;max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:linear-gradient(90deg,#8e7cff,#6c83ed);color:#fff}
.msg.bot{align-self:flex-start;background:#0d1325;border:1px solid #303956}
.chat-send{display:flex;gap:8px}.chat-send input{flex:1;background:#0d1325;border:1px solid #303956;border-radius:11px;padding:12px;color:var(--text);font:inherit;font-size:16px;outline:none}
.chat-send .primary{width:84px;margin:0;padding:0}
@media(min-width:650px){.tool-grid{grid-template-columns:repeat(5,1fr)}.tool-card:last-child:nth-child(odd){grid-column:auto;min-height:130px}}

</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#"><span class="logo">M</span><span>MARCO <b>AI</b></span></a>
  <div class="top-right">
    <div class="lang-toggle"><button id="l-hi" class="on">हिं</button><button id="l-en">EN</button></div>
    <span class="status"><i></i> <span id="status-txt">Demo</span></span>
  </div>
</header>
<main>
  <section class="hero">
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="h1" data-html="1"></h1>
    <p data-i="sub"></p>
    <div class="hero-tags"><span data-i="t1"></span><span data-i="t2"></span><span data-i="t3"></span></div>
  </section>
  <div id="banner" class="demo-banner"></div>

  <section class="tool-grid" aria-label="Tools">
    <button class="tool-card" data-tool="chat"><span class="tool-icon">💬</span><strong data-i="n_chat"></strong><small data-i="s_chat"></small></button>
    <button class="tool-card active" data-tool="youtube"><span class="tool-icon">▶</span><strong data-i="n_youtube"></strong><small data-i="s_youtube"></small></button>
    <button class="tool-card" data-tool="script"><span class="tool-icon">✍</span><strong data-i="n_script"></strong><small data-i="s_script"></small></button>
    <button class="tool-card" data-tool="prompt"><span class="tool-icon">✧</span><strong data-i="n_prompt"></strong><small data-i="s_prompt"></small></button>
    <button class="tool-card" data-tool="ideas"><span class="tool-icon">☼</span><strong data-i="n_ideas"></strong><small data-i="s_ideas"></small></button>
  </section>

  <section class="workspace">
    <div class="workspace-head">
      <div><div class="eyebrow" id="tool-kicker">TOOL 01</div><h2 id="tool-title">YouTube Writer</h2></div>
      <span class="free-pill">FREE</span>
    </div>

    <div id="chat-box" class="hidden">
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-send"><input id="chat-in" data-ph="chat_ph" autocomplete="off"><button id="chat-send" class="primary" data-i="send"></button></div>
    </div>

    <div id="gen-box">
      <label for="topic" data-i="topic_l"></label>
      <textarea id="topic" rows="3"></textarea>
      <div class="two-fields">
        <div><label for="language" data-i="lang_l"></label><select id="language"><option>Hinglish</option><option>Hindi</option><option>English</option></select></div>
        <div><label for="tone" data-i="tone_l"></label><select id="tone"><option>Engaging</option><option>Funny</option><option>Professional</option><option>Emotional</option></select></div>
      </div>
      <button id="generate" class="primary"><span data-i="gen"></span> <span>✦</span></button>
      <div id="output-wrap" class="output-wrap hidden">
        <div class="output-head"><strong data-i="result"></strong><button id="copy" class="copy"></button></div>
        <pre id="output"></pre>
      </div>
    </div>
    <p class="notice" data-i="notice"></p>
  </section>

  <section class="roadmap">
    <div class="eyebrow">BUILD PLAN</div>
    <h2 data-i="road_h"></h2>
    <div class="step"><span>01</span><div><b data-i="r1"></b><small data-i="r1s"></small></div><em data-i="r1e"></em></div>
    <div class="step"><span>02</span><div><b data-i="r2"></b><small data-i="r2s"></small></div><em data-i="r2e"></em></div>
    <div class="step"><span>03</span><div><b data-i="r3"></b><small data-i="r3s"></small></div><em data-i="r3e"></em></div>
  </section>
</main>
<footer>MARCO AI <span>Your AI. Your World.</span></footer>
<script>
// ===== SETTINGS =====
// Jab tumhara secure backend ban jaye, uska URL yahan daalna. API key yahan KABHI mat daalna.
const API_URL = "";

const I = {
hi:{eyebrow:"✦ आपका क्रिएटर वर्कस्पेस",h1:'आइडिया से <span>क्रिएशन</span><br>तक, सब एक जगह।',sub:"हिंदी और Hinglish क्रिएटर्स के लिए AI टूल्स।",
 t1:"फ्री",t2:"मोबाइल फ्रेंडली",t3:"लॉगिन नहीं",
 demo:"⚠️ DEMO MODE — अभी असली AI जुड़ा नहीं है। जवाब सिर्फ़ नमूना (template) हैं, असली AI नहीं।",live:"✅ Live AI जुड़ा है",
 n_chat:"AI Chat",s_chat:"AI से बातचीत",n_youtube:"YouTube Writer",s_youtube:"Title, description, hashtags",n_script:"Script Writer",s_script:"छोटे वीडियो स्क्रिप्ट",
 n_prompt:"Image Prompt",s_prompt:"AI इमेज प्रॉम्प्ट",n_ideas:"Content Ideas",s_ideas:"आपके niche के आइडिया",
 send:"भेजो",chat_ph:"अपना संदेश लिखो…",topic_l:"टॉपिक / आइडिया",lang_l:"आउटपुट भाषा",tone_l:"स्टाइल",gen:"बनाओ",result:"नतीजा",copy:"कॉपी",copied:"कॉपी हो गया ✓",
 notice:"नोट: DEMO MODE में ये टूल्स सिर्फ़ template बनाते हैं। असली AI के लिए सुरक्षित backend जोड़ना बाकी है।",
 road_h:"MARCO AI को स्टेप-बाय-स्टेप बनाएँगे।",r1:"Starter + Chat UI",r1s:"डिज़ाइन और काम करने वाले टूल्स",r1e:"हो गया",r2:"असली AI कनेक्शन",r2s:"सुरक्षित backend + AI API",r2e:"अगला",r3:"ऑनलाइन पब्लिश",r3s:"फ्री hosting",r3e:"बाद में",
 empty:"पहले अपना टॉपिक लिखो…",err:"कुछ गड़बड़ हुई, दोबारा कोशिश करो।",wait:"…",
 chatdemo:"[DEMO] अभी असली AI जुड़ा नहीं है, इसलिए मैं असली जवाब नहीं दे सकता। Backend जुड़ने के बाद यहाँ असली जवाब आएँगे।",
 ph:{chat:"",youtube:"जैसे: Android के लिए टॉप 5 survival games",script:"जैसे: 30 सेकंड की horror कहानी",prompt:"जैसे: बारिश की रात में cinematic portrait",ideas:"जैसे: Hindi gaming channel"}},
en:{eyebrow:"✦ YOUR CREATOR WORKSPACE",h1:'From ideas to <span>creation</span>,<br>all in one place.',sub:"AI tools for Hindi and Hinglish creators.",
 t1:"Free",t2:"Mobile friendly",t3:"No login",
 demo:"⚠️ DEMO MODE — no real AI is connected yet. Outputs are sample templates, not real AI.",live:"✅ Live AI connected",
 n_chat:"AI Chat",s_chat:"Talk to AI",n_youtube:"YouTube Writer",s_youtube:"Title, description, hashtags",n_script:"Script Writer",s_script:"Short video scripts",
 n_prompt:"Image Prompt",s_prompt:"AI image prompts",n_ideas:"Content Ideas",s_ideas:"Ideas for your niche",
 send:"Send",chat_ph:"Type your message…",topic_l:"Topic / idea",lang_l:"Output language",tone_l:"Style",gen:"Generate",result:"Result",copy:"Copy",copied:"Copied ✓",
 notice:"Note: in DEMO MODE these tools only fill templates. A secure backend is still needed for real AI.",
 road_h:"We will build MARCO AI step by step.",r1:"Starter + Chat UI",r1s:"Design and working tools",r1e:"Done",r2:"Real AI connection",r2s:"Secure backend + AI API",r2e:"Next",r3:"Publish online",r3s:"Free hosting",r3e:"Later",
 empty:"Write your topic first…",err:"Something went wrong, try again.",wait:"…",
 chatdemo:"[DEMO] No real AI is connected yet, so I cannot give a real answer. Real replies will appear here once the backend is connected.",
 ph:{chat:"",youtube:"e.g. Top 5 survival games for Android",script:"e.g. 30 second horror story",prompt:"e.g. cinematic portrait on a rainy night",ideas:"e.g. Hindi gaming channel"}}
};
const tools={youtube:{kicker:"TOOL 01"},script:{kicker:"TOOL 02"},prompt:{kicker:"TOOL 03"},ideas:{kicker:"TOOL 04"},chat:{kicker:"TOOL 00"}};
let ui="hi", current="youtube", chat=[];
const $=id=>document.getElementById(id);
const topic=$("topic"), output=$("output"), wrap=$("output-wrap");

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18)||"creator"}

// DEMO templates (sample text only, NOT real AI)
function makeResult(t,lang,tone){
 const P={
  Hinglish:{yt:`TITLE IDEAS\n1. ${t} – Ye zaroor dekho!\n2. ${t} | Complete Guide\n3. ${t} ke 5 zabardast points\n\nDESCRIPTION\nAaj ke video mein hum baat karenge: ${t}.\nVideo pasand aaye to Like, Share aur Subscribe karein.`,
   sc:`HOOK (pehle 3 second)\n${t}! Kya aapne kabhi iske baare mein socha hai?\n\nMAIN SCRIPT\nAaj hum jaanenge ${t} ke baare mein. Is topic mein kai aise points hain jo aapko hairaan kar sakte hain.\n\nENDING\nAapki rai comment mein batayein. Follow karna na bhoolein.`,
   id:`CONTENT IDEAS: ${t}\n\n1. ${t} ke liye beginner guide\n2. ${t} mein 5 aam galtiyan\n3. ${t} ke baare mein facts jo aap nahi jaante\n4. Myth vs reality: ${t}\n5. ${t}: quick tips\n6. 30 second challenge: ${t}\n7. ${t} mein try karne ki top 3 cheezein`},
  Hindi:{yt:`टाइटल आइडिया\n1. ${t} – ये ज़रूर देखें!\n2. ${t} | पूरी गाइड\n3. ${t} के 5 ज़बरदस्त पॉइंट्स\n\nडिस्क्रिप्शन\nआज के वीडियो में हम बात करेंगे: ${t}.\nवीडियो पसंद आए तो लाइक, शेयर और सब्सक्राइब करें।`,
   sc:`हुक (पहले 3 सेकंड)\n${t}! क्या आपने कभी इसके बारे में सोचा है?\n\nमुख्य स्क्रिप्ट\nआज हम जानेंगे ${t} के बारे में। इसमें कई ऐसे पॉइंट्स हैं जो आपको हैरान कर सकते हैं।\n\nअंत\nअपनी राय कमेंट में बताएँ। फॉलो करना न भूलें।`,
   id:`कंटेंट आइडिया: ${t}\n\n1. ${t} के लिए शुरुआती गाइड\n2. ${t} में 5 आम गलतियाँ\n3. ${t} के बारे में ऐसे तथ्य जो आप नहीं जानते\n4. मिथ बनाम सच: ${t}\n5. ${t}: क्विक टिप्स\n6. 30 सेकंड चैलेंज: ${t}\n7. ${t} में आज़माने की टॉप 3 चीज़ें`},
  English:{yt:`TITLE IDEAS\n1. ${t} – You Must Watch This!\n2. ${t} | Complete Guide\n3. 5 Amazing Points About ${t}\n\nDESCRIPTION\nIn this video we explore: ${t}.\nIf you enjoy it, please like, share and subscribe.`,
   sc:`HOOK (first 3 seconds)\n${t}! Have you ever thought about this?\n\nMAIN SCRIPT\nToday we look at ${t}. There are several points here that may surprise you.\n\nENDING\nTell me your opinion in the comments. Don't forget to follow.`,
   id:`CONTENT IDEAS: ${t}\n\n1. Beginner's guide to ${t}\n2. 5 common mistakes in ${t}\n3. Facts you didn't know about ${t}\n4. Myths vs reality: ${t}\n5. ${t}: quick tips\n6. 30-second challenge: ${t}\n7. Top 3 things to try in ${t}`}
 }[lang];
 if(current==="youtube") return "[DEMO]\n\n"+P.yt+`\n\nHASHTAGS\n#${slug(t)} #YouTube #Shorts #${tone}`;
 if(current==="script") return "[DEMO]\n\n"+P.sc;
 if(current==="prompt") return `[DEMO]\n\nCreate a highly detailed, realistic 4K image about: ${t}. ${tone} visual direction, cinematic composition, natural lighting, rich but realistic colors, sharp subject focus, professional photography, no text, no watermark.`;
 return "[DEMO]\n\n"+P.id;
}
async function callApi(body){
 const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 if(!r.ok) throw new Error("api"); const d=await r.json(); return d.text||"";
}

function applyLang(){
 const s=I[ui]; document.documentElement.lang=ui;
 document.querySelectorAll("[data-i]").forEach(e=>{const v=s[e.dataset.i]; if(v===undefined)return; if(e.dataset.html)e.innerHTML=v; else e.textContent=v});
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=s[e.dataset.ph]);
 $("l-hi").classList.toggle("on",ui==="hi"); $("l-en").classList.toggle("on",ui==="en");
 const b=$("banner"); b.textContent=API_URL?s.live:s.demo; b.className="demo-banner"+(API_URL?" live":"");
 $("status-txt").textContent=API_URL?"Live":"Demo";
 $("copy").textContent=s.copy;
 const name=document.querySelector(`.tool-card[data-tool="${current}"] strong`).textContent;
 $("tool-title").textContent=name; $("tool-kicker").textContent=tools[current].kicker;
 topic.placeholder=s.ph[current]||"";
 document.querySelector("#language").value = ui==="hi"?"Hindi":"English";
 renderChat();
}
function setTool(t){
 current=t;
 document.querySelectorAll(".tool-card").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));
 $("chat-box").classList.toggle("hidden",t!=="chat"); $("gen-box").classList.toggle("hidden",t==="chat");
 wrap.classList.add("hidden"); applyLang();
}
document.querySelectorAll(".tool-card").forEach(b=>b.addEventListener("click",()=>setTool(b.dataset.tool)));
$("l-hi").onclick=()=>{ui="hi";applyLang()}; $("l-en").onclick=()=>{ui="en";applyLang()};

$("generate").addEventListener("click",async()=>{
 const s=I[ui], t=topic.value.trim(), lang=$("language").value, tone=$("tone").value;
 if(!t){topic.focus();topic.placeholder=s.empty;return}
 const btn=$("generate"); btn.disabled=true;
 try{ output.textContent=API_URL?await callApi({tool:current,lang,tone,input:t}):makeResult(t,lang,tone); wrap.classList.remove("hidden") }
 catch(e){ output.textContent=s.err; wrap.classList.remove("hidden") }
 btn.disabled=false;
});
$("copy").addEventListener("click",async()=>{
 const btn=$("copy"), text=output.textContent, s=I[ui];
 try{
  if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
  else{const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  btn.textContent=s.copied;
 }catch(e){btn.textContent="Select & copy"}
 setTimeout(()=>btn.textContent=I[ui].copy,1500);
});

// ===== Chat =====
function renderChat(){
 const log=$("chat-log"); log.textContent="";
 chat.forEach(m=>{const d=document.createElement("div");d.className="msg "+(m.role==="user"?"me":"bot");d.textContent=m.content;log.appendChild(d)});
 log.scrollTop=log.scrollHeight;
}
async function sendChat(){
 const inp=$("chat-in"), x=inp.value.trim(); if(!x)return;
 chat.push({role:"user",content:x}); inp.value=""; renderChat();
